<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词听写工具（何家坳2106班）</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196F3">
    <script src="https://cdn.jsdelivr.net/npm/speak-js@1.0.24/build/speakClient.min.js"></script>
    <style>
        /* 原有样式保持不变 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        /* ... 其他样式省略 ... */
    </style>
</head>

<body>
    <!-- 原有HTML结构保持不变 -->
    <div class="container">
        <!-- ... 其他HTML内容省略 ... -->
    </div>

    <script>
        const synth = window.speechSynthesis;
        let voiceUnlocked = false;
        let voiceList = [];
        let isPlayingAll = false, playAllIndex = 0;
        let wordCnMap = new Map();
        let playWords = [];
        let voiceDetectionComplete = false;
        let pollInterval = null;
        const MAX_POLL = 30;
        let pollCount = 0;
        let offlineTTSReady = false;

        window.addEventListener('load', () => {
            initVoiceCheck();
            initOfflineTTS();
        });

        // 1. 初始化语音检测（解决事件不触发）
        function initVoiceCheck() {
            const statusDom = document.getElementById('voiceStatus');
            const listDom = document.getElementById('voiceList');

            if (!('speechSynthesis' in window)) {
                statusDom.className = 'voice-error';
                statusDom.innerText = '❌ 浏览器不支持Web Speech，使用离线TTS';
                listDom.innerText = '离线TTS加载中...';
                document.getElementById('unlockBtn').innerText = '🔊 点击激活离线TTS';
                voiceDetectionComplete = true;
                return;
            }

            // 监听标准事件（Chrome/Edge正常触发）
            synth.addEventListener('voiceschanged', updateVoiceInfo);
            // 主动轮询（解决国产浏览器事件不触发）
            startPolling();
            // 8秒超时强制放行（杜绝无限加载）
            setTimeout(() => {
                if (!voiceDetectionComplete) {
                    statusDom.className = 'voice-warn';
                    statusDom.innerText = '⚠️ 检测超时，已自动放行';
                    listDom.innerText = '点击解锁后即可使用，无声请装语音包';
                    voiceDetectionComplete = true;
                    clearInterval(pollInterval);
                }
            }, 8000);
        }

        // 2. 轮询获取语音列表（增强版，300ms间隔）
        function startPolling() {
            pollInterval = setInterval(() => {
                pollCount++;
                voiceList = synth.getVoices();
                
                // 双重条件：有语音列表 或 轮询次数达上限（30次）
                if (voiceList.length > 0 || pollCount >= MAX_POLL) {
                    updateVoiceInfo();
                    clearInterval(pollInterval);
                    voiceDetectionComplete = true;
                    // 主动触发一次空语音，预热引擎（关键修复）
                    if (voiceList.length > 0 && !voiceUnlocked) {
                        setTimeout(() => {
                            const warmup = new SpeechSynthesisUtterance('');
                            synth.speak(warmup);
                            synth.cancel(); // 立即取消，仅用于激活
                        }, 300);
                    }
                }
            }, 300);
        }

        // 3. 更新语音状态 & 列表
        function updateVoiceInfo() {
            if (voiceDetectionComplete) return;
            const statusDom = document.getElementById('voiceStatus');
            const listDom = document.getElementById('voiceList');
            voiceList = synth.getVoices();

            if (voiceList.length === 0) {
                statusDom.className = 'voice-warn';
                statusDom.innerText = '⚠️ 未检测到系统语音包，将使用离线TTS';
                listDom.innerText = '设置→无障碍 下载中文、英文语音包';
            } else {
                // 兼容不同浏览器语种标识
                const hasZh = voiceList.some(v => v.lang.includes('zh'));
                const hasEn = voiceList.some(v => v.lang.includes('en'));
                if (hasZh && hasEn) {
                    statusDom.className = 'voice-normal';
                    statusDom.innerText = '✅ 语音引擎正常，支持离线朗读';
                } else {
                    statusDom.className = 'voice-warn';
                    statusDom.innerText = '⚠️ 缺少中文/英文语音包，将使用离线TTS';
                }
                listDom.innerText = `可用语音：${voiceList.map(v => v.name).join(' | ')}`;
            }
            voiceDetectionComplete = true;
        }

        // 4. 初始化离线TTS
        function initOfflineTTS() {
            if (window.speak && !offlineTTSReady) {
                speak.setConfig({
                    lang: 'zh-CN',
                    pitch: 1.0,
                    rate: 0.8,
                    volume: 1.0
                });
                speak.onVoicesLoaded = () => {
                    offlineTTSReady = true;
                    const statusDom = document.getElementById('voiceStatus');
                    if (!('speechSynthesis' in window) || voiceList.length === 0) {
                        statusDom.className = 'voice-normal';
                        statusDom.innerText = '✅ 离线TTS引擎已就绪';
                    }
                    console.log('离线TTS引擎已就绪');
                };
                speak.loadVoices();
            }
        }

        // 5. 语音解锁（统一所有浏览器权限激活）
        function unlockAudio() {
            if (voiceUnlocked && offlineTTSReady) {
                alert('语音已解锁，可正常使用！');
                return;
            }
            
            // 激活Web Speech（如果可用）
            if ('speechSynthesis' in window) {
                synth.cancel();
                const tipUtter = new SpeechSynthesisUtterance('语音已解锁');
                tipUtter.lang = 'zh-CN';
                tipUtter.rate = 0.9;
                synth.speak(tipUtter);
                setTimeout(() => {
                    voiceList = synth.getVoices();
                }, 800);
                voiceUnlocked = true;
            }

            // 激活离线TTS
            if (window.speak && !offlineTTSReady) {
                initOfflineTTS();
                alert('正在加载离线TTS引擎，请稍候...');
            } else if (offlineTTSReady) {
                speak.speak('离线语音已激活');
            }

            document.getElementById('voiceStatus').className = 'voice-normal';
            document.getElementById('voiceStatus').innerText = '🎉 语音解锁成功';
            document.getElementById('unlockBtn').innerText = '✅ 语音已解锁';
        }

        // 6. 智能播报函数：优先Web Speech，失败则用离线TTS
        function smartSpeak(text, langType = 'en-US', rate = 0.8) {
            // 1. 优先使用Web Speech API（如果可用且已解锁）
            if ('speechSynthesis' in window && voiceUnlocked && voiceList.length > 0) {
                try {
                    synth.cancel();
                    const utter = new SpeechSynthesisUtterance(text);
                    // 语种兼容：同时适配 zh/zh-CN、en/en-US
                    utter.lang = langType === 'zh-CN' 
                        ? (voiceList.some(v=>v.lang==='zh') ? 'zh' : 'zh-CN') 
                        : (voiceList.some(v=>v.lang==='en') ? 'en' : 'en-US');
                    utter.rate = rate;
                    utter.volume = 1;

                    // 优先匹配对应语种语音，无则使用任意语音兜底
                    let targetVoice = null;
                    if (langType === 'zh-CN') {
                        targetVoice = voiceList.find(v => v.lang.includes('zh'));
                    } else {
                        targetVoice = voiceList.find(v => v.lang.includes('en'));
                    }
                    if (targetVoice) utter.voice = targetVoice;
                    else if (voiceList.length > 0) utter.voice = voiceList[0];

                    synth.speak(utter);
                    return;
                } catch (e) {
                    console.warn('Web Speech API失败，切换到离线TTS:', e);
                }
            }

            // 2. 降级使用离线TTS
            if (offlineTTSReady) {
                const options = {
                    lang: langType === 'zh-CN' ? 'zh' : 'en',
                    rate: rate,
                    pitch: 1.0,
                    volume: 1.0
                };
                speak.speak(text, options);
            } else {
                alert('请先点击【解锁语音】按钮激活语音引擎！');
            }
        }

        // 7. 原有功能函数（speakWord、playAll等）修改为使用smartSpeak
        function speakWord(en, cn, callback) {
            const mode = getPlayMode();
            const rate = parseFloat(document.getElementById('rateSlider').value);
            const repeat = parseInt(document.getElementById('repeatCount').value) || 1;
            let count = 0;

            function loopPlay() {
                如果 (计数 >= 重复) {
                    callback && callback();
                    return;
                }
                count++;
                let step = 0;
                函数 stepPlay() {
                    如果 (步骤 > 1) {
                        setTimeout(loopPlay, 400);
                        return;
                    }
                    if (mode === 'en' && step === 0) {
                        smartSpeak(en, 'en-US', rate);
                    } else if (mode === 'cn' && step === 0) {
                        smartSpeak(cn, 'zh-CN', rate * 0.95);
                    } else if (mode === 'all') {
                        if (step === 0) smartSpeak(en, 'en-US', rate);
                        if (step === 1) smartSpeak(cn, 'zh-CN', rate * 0.95);
                    }
                    步++;
                    setTimeout(stepPlay, 600);
                }
                步进播放();
            }
            循环播放();
        }

        // 原有其他函数（getPlayMode、getPlayOrder、shuffleArray等）保持不变
        // ... 其他函数省略 ...
    </script>
</body>
</html>
